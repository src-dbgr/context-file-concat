<polygon class="h" points="1296,96 1280,103 1280,89"/>
<text class="l" x="1316" y="103">Command or call</text>
<path class="ka" d="M1281 138H1220"/>
<polygon class="ha" points="1296,138 1280,145 1280,131"/>
<text class="l" x="1316" y="145">State snapshot</text>
</g>
