<polygon class="h" points="415,546 408,530 422,530"/>
<text class="l" data-for="a-start" x="435" y="498" text-anchor="start">starts</text>
<path id="a-res" class="k" data-seg="865 546 865 436" d="M865 546L865 451"/>
<polygon class="h" points="865,436 872,452 858,452"/>
<text class="l" data-for="a-res" x="885" y="498" text-anchor="start">results</text>
<path id="a-call" class="k" data-seg="640 666 640 776" d="M640 666L640 761"/>
<polygon class="h" points="640,776 633,760 647,760"/>
<text class="l" data-for="a-call" x="660" y="728" text-anchor="start">calls</text>
<path id="a-cfg" class="k" data-seg="1060 376 1220 376" d="M1075 376L1205 376"/>
<polygon class="h" points="1220,376 1204,383 1204,369"/>
<polygon class="h" points="1060,376 1076,369 1076,383"/>
<text class="l" data-for="a-cfg" x="1140" y="358" text-anchor="middle">load / save</text>
<path id="a-read" class="k" data-seg="1060 836 1220 836" d="M1060 836L1205 836"/>
<polygon class="h" points="1220,836 1204,843 1204,829"/>
<text class="l" data-for="a-read" x="1140" y="818" text-anchor="middle">reads</text>
