name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A newer push to the same branch/PR supersedes the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Pinning policy: GitHub's own actions (actions/*) by major version, third-party actions
# by commit SHA with the released version as a comment.

jobs:
  ui:
    name: UI (lint, unit, contracts, build, budgets, E2E)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui

      # Quality gates (fail fast, cheapest first)
      - name: Prettier
        run: npm run format:check
      - name: ESLint (warnings are errors)
        run: npm run lint
      - name: Svelte typecheck (warnings are errors)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Contract tests (IPC schema, Rust fixture drift guard)
        run: npm run test:contracts

      - name: Build bundle
        run: npm run build
      # Limits live in scripts/check-budgets.mjs (see docs/ci-budgets.md).
      - name: Bundle budgets (initial load / lazy chunks / workers)
        run: npm run budget:bundle

      # The app runs in WebKit (WKWebView, WebKitGTK) and Chromium (WebView2).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: E2E (Chromium)
        run: npm run test:e2e -- --project=chromium --reporter=dot
      - name: E2E (WebKit)
        run: npm run test:e2e -- --project=webkit --reporter=dot
      # Runtime budgets: deterministic conditions, Chromium only (see package.json).
      - name: E2E runtime budgets
        run: npm run test:e2e:budgets -- --reporter=dot
        env:
          BUDGET_INIT_MS: "1500"
          BUDGET_VTREE_MS: "4000" # GitHub runners are slow

      - name: Upload bundle for the release build
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: src/ui/dist
          if-no-files-found: error
          retention-days: 1

  # Debug builds do not embed src/ui/dist (see src/web_assets.rs), so this job needs no Node.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Snapshots and fixtures are compared byte for byte; keep LF on Windows.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests with snapshot verification
        env:
          INSTA_UPDATE: "no"
        run: cargo test --workspace

  # The one optimized (LTO) build: proves that the release profile compiles and that the
  # freshly built bundle can be embedded. Runs beside the tests, not in front of them.
  release-build:
    name: Release build (Linux, embeds the UI bundle)
    needs: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Download UI bundle
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: src/ui/dist
      - name: Build (release)
        run: cargo build --release
