name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Pinning policy: see ci.yml.

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Pinned like the Linux jobs of ci.yml, so a release is built against the
          # system libraries CI tested with.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: dmg
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            ext: dmg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The asset names are documented in README.md ("Installation").
      - name: Derive the asset name from the tag
        run: echo "BUNDLE_NAME=context-file-concat-${GITHUB_REF_NAME#v}-${{ matrix.name }}.${{ matrix.ext }}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/linux-deps
      - uses: ./.github/actions/setup-ui

      - name: Build JavaScript bundle
        run: npm run build
        working-directory: src/ui

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Create macOS app bundle and DMG
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --version 0.12.0 --locked
          cargo bundle --release --target ${{ matrix.target }}
          hdiutil create -volname "Context File Concatenator" \
            -srcfolder target/${{ matrix.target }}/release/bundle/osx \
            -ov -format UDZO "$BUNDLE_NAME"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "../../../$BUNDLE_NAME" context-file-concat

      - name: Create Windows archive
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a "../../../$BUNDLE_NAME" context-file-concat.exe

      - name: Hand the asset to the release job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.BUNDLE_NAME }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Publishes only when every platform built: one release with all four assets.
  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all assets
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Context File Concatenator v${{ env.VERSION }}
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: assets/*
          fail_on_unmatched_files: true
          body: |
            ## 🎉 Context File Concatenator v${{ env.VERSION }}

            **Cross-platform desktop application for LLM context preparation**

            ### 📦 Downloads
            - **macOS**: Download the `.dmg` file below
            - **Windows**: Download the `.zip` file below
            - **Linux**: Download the `.tar.gz` file below

            ### ✨ What's New
            See [CHANGELOG.md](https://github.com/src-dbgr/context-file-concat/blob/main/CHANGELOG.md) for details.
