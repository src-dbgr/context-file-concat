name: Supply chain

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # New advisories appear without a commit on our side.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency advisories (cargo audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Accepted advisories: .cargo/audit.toml
      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0
      - name: cargo audit
        run: cargo audit

      # Accepted advisories: src/ui/scripts/audit.mjs. Reads package-lock.json only.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: "24"
      - name: npm audit (high and critical)
        if: ${{ !cancelled() }}
        working-directory: src/ui
        run: npm run audit:deps
