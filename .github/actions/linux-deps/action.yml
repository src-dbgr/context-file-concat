name: Linux system dependencies
description: Installs the GTK/WebKitGTK development packages that wry/tao need. Does nothing on macOS and Windows.

runs:
  using: composite
  steps:
    - name: Install system dependencies (Linux only)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          wget \
          file \
          libssl-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libwebkit2gtk-4.1-dev
