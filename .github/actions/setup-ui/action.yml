name: Set up the UI toolchain
description: Node.js 24 with npm 11 and a clean, deterministic install of src/ui.

runs:
  using: composite
  steps:
    - name: Setup Node.js (24.x)
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        check-latest: true
        cache: npm
        cache-dependency-path: src/ui/package-lock.json

    - name: Use npm 11 (align with packageManager)
      shell: bash
      run: |
        if [ "$(npm -v | cut -d. -f1)" != "11" ]; then
          npm i -g npm@11
        fi
        echo "Node: $(node -v)"
        echo "npm : $(npm -v)"

    - name: Install npm dependencies (engine-strict, clean, deterministic)
      shell: bash
      working-directory: src/ui
      run: |
        npm config set engine-strict true
        npm ci
