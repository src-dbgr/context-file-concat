[package]
name = "context-file-concat"
version = "0.4.0"
edition = "2021"
# MSRV of the dependency tree (time 0.3.47+ requires 1.88); verified by the CI job "msrv".
rust-version = "1.88"
description = "Context File Concatenator - Intelligently select, filter, and combine project files for LLM context"
authors = ["src dbgr"]
license = "MIT"
repository = "https://github.com/src-dbgr/context-file-concat"
homepage = "https://github.com/src-dbgr/context-file-concat"
keywords = ["llm", "context", "files", "concatenation", "development"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# Web-View Architecture
wry = "0.57"
tao = "0.37"

# Core Logic & Utilities
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
ignore = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
directories = "6.0"
rayon = "1.10"
thiserror = "2.0"
tiktoken-rs = "0.12"
rust-embed = { version = "8", features = ["compression", "include-exclude"] }
mime_guess = "2.0"
open = "5.3"

[dev-dependencies]
insta = { version = "1.43", features = ["redactions", "filters"] }
proptest = "1.7"
tempfile = "3.20"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"

# macOS-only: native menu (src/platform/macos). Same objc2 generation as tao/wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

# For better Performance in Release-Build
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Panics unwind, in release as in debug: the application isolates a panicking command
# or background task (catch_unwind in app/dispatch.rs, Tokio's task boundary, the
# guards in app/tasks.rs, poison recovery in app/shared_state.rs) and keeps running.
# With "abort" all of that would be dead code and any panic would end the application.
panic = "unwind"
strip = true  # Remove debug symbols for smaller binaries

# BUNDLE INFORMATION
[package.metadata.bundle]
name = "Context File Concatenator"
identifier = "io.devsam.contextfileconcat"
version = "0.4.0"
short_description = "Context File Concatenator for LLMs"
long_description = "A desktop application to intelligently select, filter, and combine project files into a single text file optimized for Large Language Models."
icon = ["assets/icons/icon.icns"]  # macOS
resources = ["assets/icons/"]
category = "DeveloperTool"
deb_depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0"]
copyright = "Copyright © 2025 src-dbgr. All rights reserved."

# macOS specific settings
[package.metadata.bundle.osx]
minimum_system_version = "10.15"
