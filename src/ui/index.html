<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFC - Context File Concatenator</title>
    <!-- Early theme bootstrapping to avoid FOUC. A file, not an inline script:
         the content security policy of the release build allows none
         (src/platform/csp.rs). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <!-- The layout is rendered by src/App.svelte, mounted into <body>. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
